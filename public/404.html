<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Not found — Collab Canvas</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background-color: #f6f6f4;
        background-image: radial-gradient(#d8d8d2 1.1px, transparent 1.1px);
        background-size: 24px 24px;
        color: #1a1a1f;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        box-sizing: border-box;
        width: 100%;
        max-width: 24rem;
        padding: 16px 20px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .eyebrow {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.6);
      }
      h1 {
        margin: 4px 0 0;
        font-size: 18px;
      }
      p.body {
        margin: 4px 0 0;
        font-size: 14px;
        line-height: 1.45;
        color: rgba(0, 0, 0, 0.7);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      a {
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 14px;
        text-decoration: none;
      }
      a.solid {
        background: #000;
        color: #fff;
        font-weight: 500;
      }
      a.solid:hover {
        background: rgba(0, 0, 0, 0.8);
      }
      a.ghost {
        color: rgba(0, 0, 0, 0.7);
      }
      a.ghost:hover {
        background: rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Collab Canvas · 404</p>
      <h1>Nothing drawn here.</h1>
      <p class="body">This page doesn’t exist. Boards live at the root, one room per link.</p>
      <nav>
        <a class="solid" href="/">Start a new board</a>
        <a class="ghost" href="https://rokass.org/work/collab-canvas/">rokass.org ↗</a>
      </nav>
    </main>
  </body>
</html>
